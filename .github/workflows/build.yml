name: Build and Test
on:
  push:
    branches: [main, 'feature/**', 'bugfix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-build-test:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: .tools/Qt
          key: qt-windows-6.8.3-mingw1310-base-v1
      - name: Install toolchain
        run: ./scripts/dev.ps1 Setup
      - name: Configure and build
        run: ./scripts/dev.ps1 Build
      - name: Unit, integration and desktop smoke tests
        run: ./scripts/dev.ps1 Test
      - name: Prepare installer tools
        run: ./scripts/setup-installer-tools.ps1
      - name: Build Windows installer
        run: ./scripts/package.ps1
      - name: Install, test deployed runtime and uninstall
        run: ./scripts/smoke-package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: muzakere-windows-setup
          path: out/installer/setup.exe
          if-no-files-found: error
          retention-days: 14
  linux-build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ qt6-base-dev qt6-base-private-dev libqt6sql6-sqlite python3-venv
      - name: Prepare native PDFium
        run: |
          python3 -m venv .tools/python
          .tools/python/bin/pip install pypdfium2==5.13.0
          .tools/python/bin/python scripts/prepare-pdfium.py
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev --parallel 4
      - name: Unit, integration and desktop smoke tests
        run: ctest --preset dev
